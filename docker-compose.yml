services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    environment:
      ADMIN_PASSWORD_HASH_B64: "JDJ5JDEyJGxiUnMzTUowbXdqeWJDaDgueDR4ci5EdTk2TTNYbm5STlJUVTRhSHhYa2Q2ZmRROXN3QVky"

  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: appdb
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - db_data:/var/lib/mysql
      - ./arch.sql:/docker-entrypoint-initdb.d/arch.sql

  adminer:
    image: adminer
    restart: always
    ports:
      - "8081:8080"

volumes:
  db_data:
